<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification | RealEstate</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/email_style.css">
</head>

<body>

<div class="verification-page">

    <!-- Background Overlay -->

    <!-- Verification Card -->
    <div class="verification-card">

        <!-- Email Icon -->

        <div class="icon-circle">
            <i class="fa-solid fa-envelope-open-text"></i>
        </div>

        <!-- Heading -->

        <h1>Verify Your Email</h1>

        <p class="subtitle">
            We've sent a verification link to
        </p>

        <!-- Email -->

        <div class="email-box">
            john@example.com
        </div>

        <!-- Description -->

        <p class="description">
            Please check your inbox and click the verification
            link to activate your Real Estate account.
        </p>

        <!-- Info Box -->

        <div class="info-box">

            <i class="fa-solid fa-circle-info"></i>

            <span>
                The verification link will expire in
                <strong>15 minutes</strong>.
            </span>

        </div>

        <!-- Buttons -->

        <div class="button-group">

    <a href="verify_code.html" class="primary-btn">
        Verify Code
    </a>

    <button class="secondary-btn">
        Resend Code
    </button>

</div>
        <!-- Footer -->

        <div class="footer-link">

            <a href="login.html">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Sign In

            </a>

        </div>

    </div>

</div>

</body>
</html>
