<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="container">
    <!-- LEFT SIDE -->
    <div class="left-panel">
        <div class="login-content">
            <!-- Welcome -->
            <div class="welcome" id="form-header">
                <h1>Reset Password</h1>
                <p>Enter your email to receive a password reset link.</p>
            </div>

            <!-- Login Form -->
            <form id="forgotForm" autocomplete="off">
                <div class="input-group">
                    <label>Email Address</label>
                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="off"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Send Reset Link
                </button>
            </form>

            <!-- Footer -->
            <div class="signup">
                Remember your password?
                <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-panel">
        <div class="gallery">
            <div class="gallery-item item1">
                <img src="images/villa_img.png" alt="">
                <div class="overlay">
                    <h3>Luxury Villa</h3>
                    <p>Toronto</p>
                </div>
            </div>
            <div class="gallery-item item2">
                <img src="images/condo_img.png" alt="">
                <div class="overlay">
                    <h3>Luxury Condo</h3>
                    <p>Downtown</p>
                </div>
            </div>
            <div class="gallery-item item3">
                <img src="images/duplex_img.png" alt="">
                <div class="overlay">
                    <h3>DUPLEX</h3>
                    <p>CN Tower</p>
                </div>
            </div>
            <div class="gallery-item item4">
                <img src="images/background_image.png" alt="">
                <div class="overlay">
                    <h3>Modern Lifestyle</h3>
                    <p>Premium Living</p>
                </div>
            </div>
            <div class="gallery-item item5">
                <img src="images/detached_img.png" alt="">
                <div class="overlay">
                    <h3>Detached House</h3>
                    <p>Luxury Lifestyle</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/forgot_password.js"></script>
</body>
</html>
