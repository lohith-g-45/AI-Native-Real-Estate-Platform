<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verification Failed | RealEstate</title>

    <link rel="stylesheet" href="css/email_style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="verification-page">

    <div class="verification-card">

        <!-- Error Icon -->

        <div class="error-icon-circle">

            <i class="fa-solid fa-circle-xmark"></i>

        </div>

        <h1>Verification Failed</h1>

        <p class="subtitle">

            The verification code you entered is invalid or has expired.

        </p>

        <p class="description">

            Please try entering the latest verification code or request
            a new one.

        </p>

        <div class="error-box">

            <i class="fa-solid fa-triangle-exclamation"></i>

            <span>

                Invalid or expired verification code.

            </span>

        </div>

        <div class="button-group">

            <a href="verify_code.html"class="primart-btn"> 

                Try Again

            </a>

            <a href="resend.html" class="secondary-btn">

                Resend Code

            </a>

        </div>

        <div class="footer-link">

            <a href="login.html">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Sign In

            </a>

        </div>

    </div>

</div>

</body>

</html>
