<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resend Verification Code | RealEstate</title>

    <link rel="stylesheet" href="css/email_style.css"

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="verification-page">

    <div class="verification-card">

        <!-- Refresh Icon -->

        <div class="icon-circle">

            <i class="fa-solid fa-rotate"></i>

        </div>

        <!-- Heading -->

        <h1>Verification Code Sent</h1>

        <p class="subtitle">

            A new verification code has been sent to

        </p>

        <!-- Email -->

        <div class="email-box">

            john@example.com

        </div>

        <!-- Description -->

        <p class="description">

            Please check your inbox and enter the latest
            verification code to continue.

        </p>

        <!-- Timer Box -->

        <div class="timer-box">

            <i class="fa-solid fa-clock"></i>

            <span id="countdown">

                00:60

            </span>

        </div>

        <p class="timer-text">

            You can request another code once the timer
            reaches zero.

        </p>

        <!-- Buttons -->

        <div class="button-group">

            <a href="verify_code.html" class="primary-btn">
        Verify Code
    </a>

            <button class="secondary-btn disabled-btn" disabled>

                Resend Code (00:60)

            </button>

        </div>

        <!-- Footer -->

        <div class="footer-link">

            <a href="login.html">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Sign In

            </a>

        </div>

    </div>

</div>

<script>

let time = 60;

const countdown = document.getElementById("countdown");

const resendBtn = document.querySelector(".disabled-btn");

const timer = setInterval(() => {

    let minutes = Math.floor(time / 60);

    let seconds = time % 60;

    countdown.innerHTML =
        `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;

    resendBtn.innerHTML =
        `Resend Code (${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')})`;

    if(time <= 0){

        clearInterval(timer);

        resendBtn.disabled = false;

        resendBtn.classList.remove("disabled-btn");

        resendBtn.innerHTML = "Resend Code";

    }

    time--;

},1000);

</script>

</body>

</html>
