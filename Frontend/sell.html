<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell | Real Estate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <nav>
                <ul class="nav-links">
                    <li><a href="dashboard.html">Home</a></li>
                    <li><a href="buy.html">Buy</a></li>
                    <li><a href="sell.html" class="active">Sell</a></li>
                </ul>
            </nav>
            <div class="nav-right">
                <a href="buy.html" class="saved-link">
                    <i class="fa-regular fa-heart"></i>
                    <span>Saved</span>
                </a>
                <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                <button class="icon-btn"><i class="fa-regular fa-message"></i></button>
                <a href="profile.html">
                    <button class="profile-btn"><img src="images/profile.png" alt="Profile"></button>
                </a>
            </div>
        </div>
    </header>

    <section class="dashboard-content" style="padding-top: 40px;">
        <div class="left-panel" style="width: 100%;">
            
            <section class="featured-properties">
                <div class="section-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2>My Listings (Seller Dashboard)</h2>
                        <p>Manage your properties for sale.</p>
                    </div>
                    <button style="background: #2D5BFF; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;">
                        <i class="fa-solid fa-plus"></i> Add New Listing
                    </button>
                </div>
                <div class="property-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
                    
                    <div class="property-card">
                        <div class="property-image">
                            <img src="images/detached_img.png" alt="Property">
                            <span class="featured-badge" style="background: #4cd964; color: white;">Active</span>
                        </div>
                        <div class="property-content">
                            <h3>Modern Detached Home</h3>
                            <p class="location"><i class="fa-solid fa-location-dot"></i> Downtown Toronto</p>
                            <div class="property-meta">
                                <span><i class="fa-solid fa-eye"></i> 1,245 Views</span>
                                <span><i class="fa-regular fa-heart"></i> 34 Saves</span>
                            </div>
                            <div class="property-footer">
                                <h4>$1,250,000</h4>
                                <a href="#" class="details-btn" style="background: #e2e8f0; color: #1e293b;">Edit Listing</a>
                            </div>
                        </div>
                    </div>

                    <div class="property-card">
                        <div class="property-image">
                            <img src="images/villa_img.png" alt="Property">
                            <span class="featured-badge" style="background: #ffcc00; color: #1e293b;">Pending</span>
                        </div>
                        <div class="property-content">
                            <h3>Luxury Villa</h3>
                            <p class="location"><i class="fa-solid fa-location-dot"></i> Mississauga</p>
                            <div class="property-meta">
                                <span><i class="fa-solid fa-eye"></i> 3,420 Views</span>
                                <span><i class="fa-regular fa-heart"></i> 128 Saves</span>
                            </div>
                            <div class="property-footer">
                                <h4>$2,150,000</h4>
                                <a href="#" class="details-btn" style="background: #e2e8f0; color: #1e293b;">Edit Listing</a>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('accessToken')) {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
