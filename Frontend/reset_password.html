<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | HomeHaven</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="container">
    <div class="left-panel">
        <div class="login-content">
            <div class="welcome">
                <h1>Reset Password</h1>
                <p>Enter your new password below to regain access.</p>
            </div>
            
            <form id="resetForm">
                <div class="input-group">
                    <label>New Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter new password" required>
                        <i class="fa-regular fa-eye toggle-password" style="cursor:pointer;"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label>Confirm New Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                        <i class="fa-regular fa-eye toggle-password" style="cursor:pointer;"></i>
                    </div>
                </div>
                
                <p id="formError" style="color: #ff3b30; font-size: 14px; margin-bottom: 15px; display: none;"></p>
                <p id="formSuccess" style="color: #4cd964; font-size: 14px; margin-bottom: 15px; display: none;"></p>

                <button type="submit" class="login-btn">
                    Reset Password
                </button>
            </form>

            <div class="signup" style="margin-top:20px;">
                Remember your password? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="gallery">
            <div class="gallery-item item1">
                <img src="images/villa_img.png" alt="">
                <div class="overlay">
                    <h3>Secure Account</h3>
                    <p>Protected Access</p>
                </div>
            </div>
            <div class="gallery-item item2">
                <img src="images/condo_img.png" alt="">
                <div class="overlay">
                    <h3>Privacy First</h3>
                    <p>Your Data</p>
                </div>
            </div>
            <div class="gallery-item item3">
                <img src="images/duplex_img.png" alt="">
                <div class="overlay">
                    <h3>Trust</h3>
                    <p>Reliable Security</p>
                </div>
            </div>
            <div class="gallery-item item4">
                <img src="images/background_image.png" alt="">
                <div class="overlay">
                    <h3>Modern Security</h3>
                    <p>Peace of mind</p>
                </div>
            </div>
            <div class="gallery-item item5">
                <img src="images/detached_img.png" alt="">
                <div class="overlay">
                    <h3>Safe Home</h3>
                    <p>Restored Access</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/reset_password.js"></script>

</body>
</html>
