<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="container">

    <!-- LEFT SIDE -->
   <!-- ================= LEFT PANEL ================= -->

<div class="left-panel">

    <div class="login-content">

        <!-- Welcome -->

        <div class="welcome">

            <h1>Welcome Back</h1>

            <p>
                Sign in to continue your property journey.
            </p>

        </div>

        <!-- Google Button -->

        <div class="social-buttons">

            <button class="google-btn">

                <img src="images/google.png" alt="Google">

                Continue with Google

            </button>

        </div>

        <!-- Divider -->

        <div class="divider">

            <span></span>

            <p>OR</p>

            <span></span>

        </div>

        <!-- Login Form -->

        <form>

            <div class="input-group">

                <label>Email Address</label>

                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        placeholder="Enter your email"
                    >

                </div>

            </div>

            <div class="input-group">

                <label>Password</label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="Enter password"
                    >

                    <i class="fa-regular fa-eye toggle-password"></i>

                </div>

            </div>

            <div class="options">

                <label class="remember">

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit" class="login-btn">

                Sign In

            </button>

        </form>

        <!-- Footer -->

        <div class="signup">

            Don't have an account?

            <a href="create_account.html">Create Account</a>

        </div>

    </div>

</div>


    <div class="right-panel">

    <div class="gallery">

        <div class="gallery-item item1">
            <img src="images/villa_img.png" alt="">
            <div class="overlay">
                <h3>Luxury Villa</h3>
                <p>Toronto</p>
            </div>
        </div>

        <div class="gallery-item item2">
            <img src="images/condo_img.png" alt="">
            <div class="overlay">
                <h3>Luxury Condo</h3>
                <p>Downtown</p>
            </div>
        </div>

        <div class="gallery-item item3">
            <img src="images/duplex_img.png" alt="">
            <div class="overlay">
                <h3>DUPLEX</h3>
                <p>CN Tower</p>
            </div>
        </div>

        <div class="gallery-item item4">
            <img src="images/background_image.png" alt="">
            <div class="overlay">
                <h3>Modern Lifestyle</h3>
                <p>Premium Living</p>
            </div>
        </div>

        <div class="gallery-item item5">
            <img src="images/detached_img.png" alt="">
            <div class="overlay">
                <h3>Detached House</h3>
                <p>Luxury Lifestyle</p>
            </div>
        </div>

    </div>

</div>
<script src="js/login.js"></script>

</body>
</html>
